{% extends "myapp/base.html" %} 
{% block content %}
<style>
  .delete-container {
    max-width: 550px;
    margin: 4rem auto;
  }
  .delete-card {
    padding: 3rem 2.5rem;
    text-align: center;
  }
  .delete-icon {
    font-size: 3.5rem;
    color: #f87171;
    margin-bottom: 1.5rem;
    display: inline-block;
    background: rgba(239, 68, 68, 0.08);
    width: 90px;
    height: 90px;
    line-height: 90px;
    border-radius: 50%;
    border: 1px solid rgba(239, 68, 68, 0.2);
  }
  .delete-headline {
    font-size: 1.5rem;
    font-weight: 700;
    margin-bottom: 0.75rem;
  }
  .delete-subtitle {
    color: #64748b;
    margin-bottom: 2rem;
    font-size: 0.98rem;
    line-height: 1.5;
  }
  .delete-post-title {
    color: var(--text-title);
    font-weight: 700;
    display: block;
    margin-top: 0.5rem;
    font-size: 1.15rem;
  }
</style>

<div class="delete-container">
  <div class="glass-card delete-card">
    <div class="delete-icon">
      <i class="fa-regular fa-trash-can"></i>
    </div>
    <h2 class="delete-headline">Confirm Post Deletion</h2>
    <p class="delete-subtitle">
      Are you sure you want to permanently delete this story? This action is irreversible.
      <span class="delete-post-title">"{{ post.title }}"</span>
    </p>

    <form method="POST">
      {% csrf_token %}
      <div class="d-flex justify-content-center gap-3">
        <a class="btn btn-secondary px-4" href="{% url 'post-detail' post.id %}">
          Cancel
        </a>
        <button type="submit" class="btn btn-danger px-4">
          Yes, Delete Story
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock content %}
