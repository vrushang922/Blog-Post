<!-- templates/myapp/base.html -->

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>{% block title %}My Blog{% endblock %}</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Poppins:wght@600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "Inter", sans-serif;
        background: #f4f6f9;
        color: #2c2c2c;
      }

      /* ✅ Sticky custom navbar */
      .custom-navbar {
        background-color: #d1d5db; /* medium gray */
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        position: sticky;
        top: 0;
        z-index: 1030;
      }

      /* ✅ Navbar links — all same style with smooth transition */
      .custom-navbar .navbar-brand,
      .custom-navbar .nav-link {
        color: #374151 !important; /* dark gray */
        font-weight: 500;
        font-family: "Inter", sans-serif;
        font-size: 1rem;
        margin-right: 0.8rem;
        border-radius: 6px;
        padding: 6px 12px;
        text-decoration: none;
        transition: color 0.3s ease, background-color 0.3s ease;
      }

      /* Hover effect — white text on blue background */
      .custom-navbar .nav-link:hover,
      .custom-navbar .nav-link:focus,
      .custom-navbar .navbar-brand:hover,
      .custom-navbar .navbar-brand:focus {
        color: #ffffff !important;
        background-color: #1d4ed8;
        font-weight: 500;
      }

      /* Active li  nk — permanent hover effect */
      .custom-navbar .nav-link.active,
      .custom-navbar .navbar-brand.active {
        color: #ffffff !important;
        background-color: #1d4ed8;
        font-weight: 500;
      }

      /* ✅ Logout button */
      .logout-btn {
        background: #dc2626;
        border: none;
        color: #fff;
        font-weight: 600;
        padding: 6px 12px;
        border-radius: 6px;
        transition: background 0.3s ease;
        width: 100%;
        text-align: center;
      }

      .logout-btn:hover {
        background: #b91c1c;
        color: #fff;
      }

      /* ✅ Flash messages */
      .alert {
        border-radius: 12px;
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>
  <body>
    <!-- ✅ Navbar -->
    <nav class="navbar navbar-expand-lg custom-navbar">
      <div class="container">
        <a
          class="navbar-brand {% if request.path == '/' %}active{% endif %}"
          href="{% url 'home' %}"
        >
          My Blog
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto">
            <li class="nav-item">
              <a
                class="nav-link {% if request.path == '/blog/' %}active{% endif %}"
                href="{% url 'blog' %}"
                >Blog</a
              >
            </li>
          </ul>
          <ul class="navbar-nav ms-auto">
            {% if user.is_authenticated %}
            <li class="nav-item">
              <a
                class="nav-link {% if request.path == '/post-create/' %}active{% endif %}"
                href="{% url 'post-create' %}"
                >New Post</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link {% if request.path == '/profile/' %}active{% endif %}"
                href="{% url 'profile' %}"
                >Profile</a
              >
            </li>
            <li class="nav-item">
              <form method="POST" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit" class="logout-btn">Logout</button>
              </form>
            </li>
            {% else %}
            <li class="nav-item">
              <a
                class="nav-link {% if request.path == '/register/' %}active{% endif %}"
                href="{% url 'register' %}"
                >Register</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link {% if request.path == '/login/' %}active{% endif %}"
                href="{% url 'login' %}"
                >Login</a
              >
            </li>
            {% endif %}
          </ul>
        </div>
      </div>
    </nav>

    <!-- ✅ Flash messages -->
    <div class="container mt-3">
      {% if messages %} {% for message in messages %}
      <div
        class="alert alert-{{ message.tags }} alert-dismissible fade show text-center"
        role="alert"
      >
        {{ message }}
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="alert"
          aria-label="Close"
        ></button>
      </div>
      {% endfor %} {% endif %}
    </div>

    <!-- ✅ Main content -->
    <div class="container mt-4">{% block content %} {% endblock %}</div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
