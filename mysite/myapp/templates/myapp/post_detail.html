{% extends "myapp/base.html" %} {% block content %}
<style>
  /* Post container */
  .content-section {
    background-color: #f8f9fa;
    border-radius: 0.75rem;
    padding: 2rem;
    margin-top: 2rem;
    border: 1px solid #e0e0e0;
    transition: box-shadow 0.25s ease, transform 0.2s ease;
  }

  .content-section:hover {
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
    transform: translateY(-2px);
  }

  /* Metadata row */
  .article-metadata {
    font-size: 0.9rem;
    color: #6c757d;
    margin-bottom: 1rem;
  }

  /* Styled Author */
  .post-author {
    display: inline-block;
    font-weight: 600;
    color: #1d4ed8;
    background-color: #e0f2fe; /* subtle blue background */
    padding: 2px 8px;
    border-radius: 6px;
    text-decoration: none; /* remove underline */
    transition: all 0.3s ease;
  }

  .post-author:hover {
    color: #0c4a6e; /* darker blue on hover */
    background-color: #bae6fd; /* lighter highlight on hover */
  }

  /* Title */
  .article-title {
    font-size: 1.75rem;
    font-weight: 600;
    color: #212529;
    margin-bottom: 1rem;
  }

  /* Content */
  .article-content {
    font-size: 1.05rem;
    line-height: 1.7;
    color: #495057;
  }

  /* Buttons */
  .post-actions {
    margin-top: 1.2rem;
  }

  .post-actions .btn {
    padding: 0.4rem 1.2rem;
    font-size: 0.95rem;
    border-radius: 0.5rem;
  }
</style>

<div class="container">
  <article class="content-section">
    <!-- Metadata row -->
    <div
      class="d-flex justify-content-between align-items-center article-metadata"
    >
      <a class="post-author" href="{% url 'user-posts' post.author.username %}">
        ✍️ {{ post.author }}
      </a>
      <div>{{ object.date_posted|date:"F d, Y" }}</div>
    </div>

    <!-- Title -->
    <h2 class="article-title">{{ object.title }}</h2>

    <!-- Content -->
    <p class="article-content">{{ object.content }}</p>

    <!-- Actions (Update/Delete) -->
    {% if object.author == user %}
    <div class="post-actions d-flex gap-2">
      <a class="btn btn-secondary" href="{% url 'post-update' object.pk %}"
        >Update</a
      >
      <a class="btn btn-danger" href="{% url 'post-delete' object.pk %}"
        >Delete</a
      >
    </div>
    {% endif %}
  </article>
</div>
{% endblock content %}
