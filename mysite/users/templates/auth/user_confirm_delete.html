{% extends "myapp/base.html" %}
{% block content %}
<style>
  .delete-account-wrap {
    max-width: 620px;
    margin: 4rem auto;
  }

  .delete-account-card {
    padding: 2.75rem;
  }

  .delete-account-title {
    font-size: 1.6rem;
    font-weight: 800;
    margin-bottom: 0.85rem;
    background: linear-gradient(135deg, #142235, #dc2626);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .delete-account-copy {
    color: #64748b;
    line-height: 1.6;
    margin-bottom: 2rem;
  }

  .delete-account-name {
    color: var(--text-title);
    font-weight: 700;
  }
</style>

<div class="delete-account-wrap">
  <div class="glass-card delete-account-card">
    <h2 class="delete-account-title">Delete Account</h2>
    <p class="delete-account-copy">
      Are you sure you want to permanently delete
      <span class="delete-account-name">{{ user.username }}</span>?
      This will also remove the published blogs tied to this account.
    </p>

    <form method="POST">
      {% csrf_token %}
      <div class="d-flex flex-wrap gap-3">
        <button type="submit" class="btn btn-danger px-4">
          Yes, Delete
        </button>
        <a class="btn btn-outline-secondary px-4" href="{% url 'profile' %}">
          Cancel
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock content %}
