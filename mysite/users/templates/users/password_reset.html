{% extends "myapp/base.html" %} {% load crispy_forms_tags %} {% block content %}
<div class="container d-flex justify-content-center align-items-center mt-5">
  <div class="card shadow-lg border-0 rounded-4 w-50">
    <div class="card-body p-4">
      <!-- Title -->
      <h2 class="text-center text-primary mb-4">🔑 Password Reset</h2>
      <p class="text-muted text-center mb-4">
        Enter your email address and we'll send you instructions to reset your
        password.
      </p>

      <!-- Form -->
      <form method="POST">
        {% csrf_token %} {{ form|crispy }}

        <!-- Button -->
        <div class="d-grid mt-4">
          <button
            type="submit"
            class="btn btn-primary btn-lg rounded-pill shadow-sm"
          >
            Request Password Reset
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
