{% extends "myapp/base.html" %} 
{% load crispy_forms_tags %} 
{% block content %}
<style>
  .auth-container {
    max-width: 500px;
    margin: 4rem auto;
  }
  .auth-card {
    padding: 3rem 2.5rem;
  }
  .auth-header {
    text-align: center;
    margin-bottom: 2.5rem;
  }
  .auth-icon {
    font-size: 2.2rem;
    background: var(--primary-gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 0.5rem;
    display: inline-block;
  }
  .auth-title {
    font-size: 1.8rem;
    font-weight: 800;
    margin-bottom: 0.5rem;
    background: linear-gradient(135deg, #142235, #2563eb);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .auth-subtitle {
    color: #64748b;
    font-size: 0.95rem;
  }
</style>

<div class="auth-container">
  <div class="glass-card auth-card">
    <div class="auth-header">
      <div class="auth-icon">
        <i class="fa-solid fa-user-plus"></i>
      </div>
      <h2 class="auth-title">Create Account</h2>
      <p class="auth-subtitle">Join our community to start sharing your Blogs and insights.</p>
    </div>

    <!-- Registration form -->
    <form method="POST">
      {% csrf_token %} 
      {{ form|crispy }}

      <div class="mt-4 pt-2">
        <button type="submit" class="btn btn-primary w-100 py-3 d-flex align-items-center justify-content-center gap-2">
          <span>Get Started</span>
          <i class="fa-solid fa-rocket fs-6"></i>
        </button>
      </div>
    </form>

    <div class="border-top border-secondary border-opacity-10 mt-4 pt-3 text-center">
      <small class="text-secondary">
        Already have an Account?
        <a class="text-primary text-decoration-none ms-2 fw-semibold" href="{% url 'login' %}">
          Login
        </a>
      </small>
    </div>
  </div>
</div>
{% endblock %}
